apiVersion: v1
kind: Secret
metadata:
  name: scrapebook-secrets
  namespace: scrapebook
type: Opaque
# NOTE: Replace these placeholder values with strong secrets before deploying to production.
# For production use, consider tools like Sealed Secrets or external-secrets-operator
# instead of storing secrets directly in this file.
stringData:
  DB_PASSWORD: "CHANGE_ME_STRONG_DB_PASSWORD"
  JWT_SECRET: "CHANGE_ME_STRONG_JWT_SECRET_AT_LEAST_32_CHARS"
  POSTGRES_PASSWORD: "CHANGE_ME_STRONG_DB_PASSWORD"
