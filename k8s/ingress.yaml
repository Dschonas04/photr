apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scrapebook-ingress
  namespace: scrapebook
spec:
  ingressClassName: nginx
  rules:
    - host: scrapebook.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
