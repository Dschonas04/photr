name: prüfen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruefen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dienst:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: |
          nicht_formatiert=$(gofmt -l .)
          if [ -n "$nicht_formatiert" ]; then echo "$nicht_formatiert"; exit 1; fi
      - run: go vet ./...
      - run: go test -race ./...

  oberflaeche:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run build

  abbilder:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [dienst, oberflaeche]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: startet und antwortet
        run: |
          docker compose up -d --build --wait
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/api/public/scrapbooks && exit 0; sleep 1; done
          docker compose logs; exit 1
      - if: always()
        run: docker compose down -v
